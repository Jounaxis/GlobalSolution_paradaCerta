# Perfil dev: roda a API sem Oracle, sem RabbitMQ e sem chave da OpenAI.
# Feito para o time do front testar o app:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Nao use em producao: os segredos abaixo sao publicos.
spring:
  datasource:
    url: jdbc:h2:mem:citizentech;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  ai:
    openai:
      # Sem chave real a chamada falha e o totem usa a frase padrao (fallback)
      api-key: ${OPENAI_API_KEY:sem-chave-no-perfil-dev}
    retry:
      max-attempts: 1

citizentech:
  jwt:
    secret: ${JWT_SECRET:segredo-do-perfil-dev-com-mais-de-32-bytes}
  hash:
    secret: ${HASH_SECRET:segredo-de-hash-do-perfil-dev}
  mensageria:
    # local: aviso ao motorista roda na propria API, sem fila (ver AvisoMotoristaLocal)
    modo: local

management:
  health:
    rabbit:
      enabled: false
