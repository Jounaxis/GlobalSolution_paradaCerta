spring:
  application:
    name: citizentech

  # ---------- Banco de dados (Oracle FIAP) ----------
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    # As tabelas ja existem no Oracle (script DDL): o Hibernate so confere o mapeamento.
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  # ---------- Paginacao ----------
  # Serializa Page como { content, page: { size, number, totalElements, totalPages } }
  data:
    web:
      pageable:
        serialization-mode: via-dto

  # ---------- Mensageria (Requisito 5 - Opcao A: RabbitMQ) ----------
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Ate 3 tentativas no consumidor; depois a mensagem e rejeitada e vai para a DLQ
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

  # ---------- Spring AI (OpenAI) ----------
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        # Uma tentativa com prazo de 3 s; o totem recebe a frase padrao em caso de falha.
        timeout: 3s
        max-retries: 0
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.3

  # ---------- Timeouts das chamadas HTTP externas (OpenAI) ----------
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 10s

citizentech:
  # rabbit (padrao): evento vai para o RabbitMQ | local: aviso roda na propria API (perfil dev)
  mensageria:
    modo: ${MENSAGERIA_MODO:rabbit}
  # Origens liberadas no CORS, separadas por virgula (ex.: http://localhost:8081)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # ---------- Seguranca (JWT) ----------
  jwt:
    # Chave HMAC com no minimo 32 caracteres (256 bits)
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    issuer: citizentech-api
  # ---------- Hash do UID do cartao e do token do totem ----------
  hash:
    secret: ${HASH_SECRET}
  # ---------- Primeiro gestor (opcional, criado ao subir se nao existir) ----------
  gestor-inicial:
    nome: ${GESTOR_NOME:Gestor}
    email: ${GESTOR_EMAIL:}
    senha: ${GESTOR_SENHA:}

# ---------- Swagger / OpenAPI ----------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ---------- Actuator (health check usado no deploy da Azure) ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}
