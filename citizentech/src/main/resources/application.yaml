spring:
  application:
    name: citizentech

  # ---------- Banco de dados (Oracle FIAP) ----------
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    # As tabelas ja existem no Oracle (script DDL): o Hibernate so confere o mapeamento.
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  # ---------- Mensageria (Requisito 5 - Opcao A: RabbitMQ) ----------
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # ---------- Spring AI (OpenAI) ----------
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.3

# ---------- Seguranca (JWT) ----------
citizentech:
  jwt:
    # Chave HMAC com no minimo 32 caracteres (256 bits)
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    issuer: citizentech-api

# ---------- Swagger / OpenAPI ----------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ---------- Actuator (health check usado no deploy da Azure) ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}
